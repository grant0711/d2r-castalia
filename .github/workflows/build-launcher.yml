name: Build Castalia Launcher (Windows x64)

on:
  workflow_dispatch:
  pull_request:
    branches: [master, release]
    paths:
      - "castalia_hub/**"
      - "bin/d2r-launcher"
      - "tools/mod_builder/char_manager.py"
      - "tools/mod_builder/common.py"
      - "tools/mod_builder/mod_config.json"
      - "tools/char_templates/**"
      - ".github/workflows/build-launcher.yml"
  push:
    branches: [master, release, "feat/**"]
    paths:
      - "castalia_hub/**"
      - "bin/d2r-launcher"
      - "tools/mod_builder/char_manager.py"
      - "tools/mod_builder/common.py"
      - "tools/mod_builder/mod_config.json"
      - "tools/char_templates/**"
      - ".github/workflows/build-launcher.yml"

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package castalia-launcher-win64.zip (PSF-signed Embeddable Python 3.12)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyVer = "3.12.10"
          $pyUrl = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          $stage = "dist\castalia-launcher-win64"
          $pyDir = "$stage\python"
          $appDir = "$stage\app"

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stage, "dist\castalia-launcher-win64.zip"
          New-Item -ItemType Directory -Force -Path $pyDir, "$appDir\bin", "$appDir\tools\mod_builder", "$appDir\vanilla-reference\data\global\excel" | Out-Null

          # 1. Download official PSF-signed Windows Embeddable Python (0/70 VirusTotal)
          $pyZip = "$env:TEMP\python-$pyVer-embed-amd64.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          Expand-Archive -Path $pyZip -DestinationPath $pyDir -Force

          # Configure python312._pth so ..\app and ..\app\tools are on sys.path
          $pthFile = Get-ChildItem -Path $pyDir -Filter "python*._pth" | Select-Object -First 1
          if (-not $pthFile) { throw "Missing python*._pth in embeddable zip" }
          Add-Content -Path $pthFile.FullName -Value "`n..\app`n..\app\tools`nimport site"

          # 2. Copy plain-text launcher scripts & character templates
          Copy-Item "bin\d2r-launcher" "$appDir\bin\d2r-launcher"
          Copy-Item -Recurse "castalia_hub" "$appDir\castalia_hub"
          Get-ChildItem -Path "$appDir\castalia_hub" -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Copy-Item "tools\mod_builder\char_manager.py" "$appDir\tools\mod_builder\"
          Copy-Item "tools\mod_builder\common.py" "$appDir\tools\mod_builder\"
          Copy-Item "tools\mod_builder\mod_config.json" "$appDir\tools\mod_builder\"
          if (Test-Path "tools\mod_builder\__init__.py") {
            Copy-Item "tools\mod_builder\__init__.py" "$appDir\tools\mod_builder\"
          }
          Copy-Item -Recurse "tools\char_templates" "$appDir\tools\char_templates"
          Copy-Item "vanilla-reference\data\global\excel\charstats.txt" "$appDir\vanilla-reference\data\global\excel\"
          Copy-Item "vanilla-reference\data\global\excel\experience.txt" "$appDir\vanilla-reference\data\global\excel\"

          # 3. Create 1-click launcher .bat (uses PSF-signed pythonw.exe — no console flash)
          @"
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0python\pythonw.exe" "%~dp0app\bin\d2r-launcher" %*
          "@ | Set-Content -Path "$stage\Launch Castalia.bat" -Encoding ASCII

          @"
          Castalia Co-Op Campaign Launcher (Windows x64)
          ==============================================
          1. Extract this entire folder anywhere (e.g. Desktop or C:\Games\CastaliaLauncher\).
          2. Double-click "Launch Castalia.bat".
          3. No Python installation is required — this folder bundles the official
             Python Software Foundation signed embeddable runtime (python/) plus
             100% inspectable plain-text launcher scripts (app/).

          Troubleshooting:
          If the window does not open, run this from Command Prompt inside this folder
          to see any error output:
            python\python.exe app\bin\d2r-launcher
          "@ | Set-Content -Path "$stage\README.txt" -Encoding ASCII

          # 4. Pack distributable zip
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\castalia-launcher-win64.zip" -Force
          Get-Item "dist\castalia-launcher-win64.zip" | Format-List Name, Length

      - name: Smoke-test castalia-launcher-win64.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = "$env:TEMP\castalia-launcher-smoke"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $testDir
          Expand-Archive -Path "dist\castalia-launcher-win64.zip" -DestinationPath $testDir -Force

          & "$testDir\python\python.exe" "$testDir\app\bin\d2r-launcher" --help
          if ($LASTEXITCODE -ne 0) { throw "d2r-launcher --help failed" }

          & "$testDir\python\python.exe" -c "import castalia_hub.core, castalia_hub.d2s_telemetry, mod_builder.char_manager as cm; print('SMOKE_OK:', len(cm.CLASS_NAME_TO_ID), 'classes')"
          if ($LASTEXITCODE -ne 0) { throw "module import smoke test failed" }

      - name: Upload castalia-launcher-win64.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: castalia-launcher-win64
          path: dist/castalia-launcher-win64.zip
          if-no-files-found: error
