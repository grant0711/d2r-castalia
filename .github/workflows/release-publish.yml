name: Publish Release & Cascade

on:
  push:
    branches: ["release"]
  workflow_dispatch:
    inputs:
      repost_tag:
        description: "Optional: re-post Discord card for an already-published tag (e.g. v0.4.4)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "release-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version & check Draft Release status
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          with open("tools/mod_builder/mod_config.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          version = cfg["version"]
          tag = f"v{version}"

          res = subprocess.run(
              ["gh", "release", "view", tag, "--json", "isDraft,url,body"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          out = {}
          out["version"] = version
          out["tag"] = tag
          out["compat"] = cfg.get("save_compat", "compatible")
          if res.returncode != 0:
              print(f"[publish] No GitHub Release found for {tag}; skipping cascade (initial branch bootstrap).")
              out["should_publish"] = "false"
          else:
              data = json.loads(res.stdout)
              if data.get("isDraft"):
                  print(f"[publish] Found Draft Release {tag}; ready to promote and cascade.")
                  out["should_publish"] = "true"
              else:
                  print(f"[publish] Release {tag} is already published; nothing to do.")
                  out["should_publish"] = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gf:
              for k, v in out.items():
                  gf.write(f"{k}={v}\n")
          PY

      - name: Promote Draft GitHub Release to Published
        if: steps.meta.outputs.should_publish == 'true'
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest --target release
          URL=$(gh release view "$TAG" --json url -q .url)
          echo "release_url=$URL" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --json body -q .body > release_notes.md
          gh release download "$TAG" -p "castalia-${TAG}.zip" --clobber

      - name: Upload to Nexus Mods (optional)
        if: steps.meta.outputs.should_publish == 'true' && vars.NEXUSMODS_ENABLED == 'true'
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "[publish] Nexus Mods upload configured for mod ${NEXUSMODS_MOD_ID} (v${VERSION}) — hook Nexus upload CLI/API here when ready."

      - name: Post announcement to Discord Webhook
        if: steps.meta.outputs.should_publish == 'true' || github.event.inputs.repost_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.inputs.repost_tag != '' && github.event.inputs.repost_tag || steps.meta.outputs.tag }}
          RELEASE_URL: ${{ steps.promote.outputs.release_url }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request

          webhook = (os.environ.get("WEBHOOK_URL") or "").strip()
          if not webhook:
              print("[publish] DISCORD_WEBHOOK_URL not configured; skipping Discord post.")
              sys.exit(0)

          tag = os.environ["TAG"].strip()
          rel_raw = subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "url,body,assets"],
              text=True,
          )
          rel = json.loads(rel_raw)
          release_url = (os.environ.get("RELEASE_URL") or rel.get("url") or "").strip()
          body = (rel.get("body") or "").strip()
          asset_names = [a.get("name", "") for a in (rel.get("assets") or [])]

          # Fetch newly created remote tags so git diff prev_tag..tag always resolves
          subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
          # Detect if Launcher code changed since the previous v* tag
          tags_raw = subprocess.check_output(["git", "tag", "--list", "--sort=-v:refname", "v*"], text=True).splitlines()
          prev_tag = next((t for t in tags_raw if t != tag), None)
          launcher_changed = False
          if prev_tag:
              diff_files = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{prev_tag}..{tag}"],
                  text=True,
              ).splitlines()
              launcher_prefixes = (
                  "castalia_hub/",
                  "bin/d2r-launcher",
                  "tools/mod_builder/char_manager.py",
                  "tools/char_templates/",
              )
              launcher_changed = any(f.startswith(launcher_prefixes) for f in diff_files)

          has_exe = "CastaliaLauncher-Setup.exe" in asset_names
          exe_url = f"https://github.com/grant0711/d2r-castalia/releases/download/{tag}/CastaliaLauncher-Setup.exe"

          fields = []
          if launcher_changed and has_exe:
              fields.append({
                  "name": "⬇️ Launcher Update Included (Windows)",
                  "value": f"[Download CastaliaLauncher-Setup.exe]({exe_url}) — run over your existing install (saves & settings are preserved).",
                  "inline": False,
              })
          else:
              fields.append({
                  "name": "🔄 How to Update",
                  "value": "No new launcher installer needed! Just open your Castalia Launcher and play — it automatically downloads & verifies this mod update.",
                  "inline": False,
              })

          fields.append({"name": "Release Notes & Files", "value": release_url, "inline": True})
          fields.append({"name": "Compendium & Skill Calc", "value": "https://grant0711.github.io/d2r-castalia/", "inline": True})

          nexus_id = os.environ.get("NEXUS_MOD_ID", "").strip()
          if nexus_id:
              fields.append({
                  "name": "Nexus Mods",
                  "value": f"https://www.nexusmods.com/diablo2resurrected/mods/{nexus_id}",
                  "inline": True,
              })

          payload = {
              "embeds": [{
                  "title": f"🔥 Castalia {tag} Released",
                  "url": release_url,
                  "description": body[:3600] if body else f"Castalia {tag} is now live!",
                  "color": 0xC89B3C,
                  "fields": fields,
              }]
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "CastaliaReleaseBot/1.0"},
          )
          urllib.request.urlopen(req)
          print(f"[publish] Posted release embed for {tag} to Discord (launcher_changed={launcher_changed}).")
          PY
