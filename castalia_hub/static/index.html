<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="castalia-token" content="__CASTALIA_TOKEN__">
<title>Castalia Launcher &amp; Campaign Hub</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #151412;
    --panel2: #1c1a16;
    --border: #4a3b22;
    --border-hi: #c89b3c;
    --gold: #f0d890;
    --gold-dim: #b89448;
    --text: #ddd6c5;
    --muted: #9a907d;
    --green: #4ec970;
    --red: #d9534f;
    --blue: #7bc4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Verdana, Geneva, sans-serif; font-size: 13px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3, .serif { font-family: "Palatino Linotype", Georgia, serif; color: var(--gold); margin: 0; }

  .topbar {
    background: linear-gradient(180deg, #211a10 0%, #110e0a 100%);
    border-bottom: 2px solid var(--border-hi);
    padding: 10px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 19px; letter-spacing: 1px; }
  .shell { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 220px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-between; padding: 12px 10px;
  }
  .nav-btn {
    display: block; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 5px;
    background: transparent; border: 1px solid transparent; color: var(--text);
    font-family: "Palatino Linotype", Georgia, serif; font-size: 14px; cursor: pointer;
  }
  .nav-btn:hover { background: var(--panel2); border-color: var(--border); }
  .nav-btn.active { background: #261e11; border-color: var(--border-hi); color: var(--gold); font-weight: bold; }

  .status-box {
    border-top: 1px solid var(--border); padding-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.6;
  }
  .ok { color: var(--green); font-weight: bold; }
  .warn { color: #e8b048; font-weight: bold; }

  .main { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .space-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  .card {
    background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 12px;
  }
  .card.live { border-color: var(--green); background: #121c14; }
  .pill {
    display: inline-block; padding: 2px 8px; font-size: 11px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--gold); margin-right: 4px;
  }
  .pill.live { border-color: var(--green); color: var(--green); font-weight: bold; }

  .btn {
    background: #2b2112; border: 1px solid var(--border-hi); color: var(--gold);
    padding: 7px 14px; font-size: 12px; font-weight: bold; cursor: pointer;
  }
  .btn:hover { background: #3c2e19; }
  .btn.primary { background: #4a3513; color: #fff4d2; }
  .btn.launch { background: #1c4a27; border-color: var(--green); color: #e2ffe8; font-size: 13px; padding: 9px 18px; }
  .btn.launch:hover { background: #256134; }
  .btn.danger { background: #3b1717; border-color: var(--red); color: #ffd4d4; }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); font-weight: normal; }

  input, select, textarea {
    background: #0d0c0a; border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; font-family: inherit; font-size: 12px;
  }
  label { display: block; font-size: 11px; color: var(--gold-dim); margin: 8px 0 3px; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border-bottom: 1px solid #2b2419; padding: 7px 8px; text-align: left; font-size: 12px; }
  th { color: var(--gold-dim); font-size: 11px; text-transform: uppercase; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 540px; max-width: 94vw; max-height: 90vh; overflow-y: auto;
    background: var(--panel); border: 2px solid var(--border-hi); padding: 18px 20px;
  }
  .toast {
    position: fixed; bottom: 16px; right: 18px; background: #241c10; border: 1px solid var(--border-hi);
    color: var(--gold); padding: 10px 14px; font-size: 12px; display: none; z-index: 80;
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>&#9876; CASTALIA LAUNCHER &amp; CAMPAIGN HUB</h1>
  <div class="row">
    <a href="https://grant0711.github.io/d2r-castalia/" target="_blank" rel="noopener" style="font-size:12px;">Compendium &#8599;</a>
    <a href="https://discord.gg/3mMNCnaze4" target="_blank" rel="noopener" style="font-size:12px;">Discord &#8599;</a>
    <button class="btn primary" onclick="openCreateModal()">+ Create Campaign</button>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div>
      <button class="nav-btn active" id="nav-campaigns" onclick="showTab('campaigns')">Campaigns</button>
      <button class="nav-btn" id="nav-solo" onclick="showTab('solo')">Solo Play</button>
      <button class="nav-btn" id="nav-hoh" onclick="showTab('hoh')">Hall of Heroes</button>
      <button class="nav-btn" id="nav-settings" onclick="showTab('settings')">Settings</button>
    </div>
    <div class="status-box" id="status-box">Loading environment...</div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- CREATE CAMPAIGN MODAL -->
<div class="modal-backdrop" id="modal-create">
  <div class="modal">
    <div class="space-between"><h3>Create New Campaign</h3><button class="btn ghost" onclick="closeModal('modal-create')">X</button></div>
    <label>Title</label>
    <input id="c-title" style="width:100%" placeholder="Thursday Night Pilgrimage">
    <label>Description</label>
    <textarea id="c-desc" rows="2" style="width:100%" placeholder="Grounded 4-player push Normal -> Hell. Drop-ins welcome!"></textarea>
    <label>Pinned Castalia Version</label>
    <select id="c-version" style="width:100%"></select>
    <div class="row">
      <div style="flex:1">
        <label>Campaign Mode (locked at creation)</label>
        <select id="c-mode" style="width:100%" onchange="onCreateModeChange()">
          <option value="pilgrimage">&#127942; Pilgrimage (Fresh Lvl 1 &rarr; Hell Baal &middot; Timed &amp; Hall of Heroes)</option>
          <option value="open">&#9876; Open Party (Allow imported chars &middot; Untimed casual)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Start Level</label><input id="c-level" type="number" min="1" max="99" value="1" style="width:100%" disabled></div>
      <div style="flex:1"><label>Start Act / WP</label>
        <select id="c-wp" style="width:100%" disabled>
          <option value="a1n">Normal Act 1 (a1n)</option><option value="a2n">Normal Act 2 (a2n)</option><option value="a3n">Normal Act 3 (a3n)</option><option value="a4n">Normal Act 4 (a4n)</option><option value="a5n">Normal Act 5 (a5n)</option>
          <option value="a1nm">Nightmare Act 1 (a1nm)</option><option value="a2nm">Nightmare Act 2 (a2nm)</option><option value="a3nm">Nightmare Act 3 (a3nm)</option><option value="a4nm">Nightmare Act 4 (a4nm)</option><option value="a5nm">Nightmare Act 5 (a5nm)</option>
          <option value="a1h">Hell Act 1 (a1h)</option><option value="a2h">Hell Act 2 (a2h)</option><option value="a3h">Hell Act 3 (a3h)</option><option value="a4h">Hell Act 4 (a4h)</option><option value="a5h">Hell Act 5 (a5h)</option>
        </select>
      </div>
      <div style="flex:1"><label>Max Seats</label><input id="c-seats" type="number" min="2" max="8" value="5" style="width:100%"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Schedule Text</label><input id="c-sched" style="width:100%" value="Thursdays 8:00–10:00 PM"></div>
    </div>
    <div class="row">
      <div style="flex:2"><label>Next Session Date &amp; Time</label><input id="c-next" type="datetime-local" style="width:100%"></div>
      <div style="flex:1"><label>Timezone (GMT)</label><select id="c-tz" style="width:100%"></select></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;">
      <input type="checkbox" id="c-shared-stash" style="width:auto;">
      <span>Allow Global Shared Stash <span style="color:var(--muted);font-size:11px;">(unchecked = isolated campaign-only stash; locked at creation)</span></span>
    </label>
    <div class="row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn ghost" onclick="closeModal('modal-create')">Cancel</button>
      <button class="btn primary" onclick="submitCreateCampaign()">Create Campaign &amp; Publish</button>
    </div>
  </div>
</div>

<!-- CREATE / DROP-IN CHARACTER MODAL -->
<div class="modal-backdrop" id="modal-dropin">
  <div class="modal">
    <div class="space-between"><h3 id="di-title">Create Campaign Character</h3><button class="btn ghost" onclick="closeModal('modal-dropin')">X</button></div>
    <div id="di-banner" class="card" style="margin-top:10px; font-size:12px;"></div>
    <label>Character Name (max 15 letters/numbers)</label>
    <input id="di-name" style="width:100%" maxlength="15" placeholder="Lyra">
    <label>Class</label>
    <select id="di-class" style="width:100%">
      <option value="pal">Paladin</option>
      <option value="bar">Barbarian</option>
      <option value="ass">Assassin</option>
      <option value="sor">Sorceress</option>
    </select>
    <div class="row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn ghost" onclick="closeModal('modal-dropin')">Cancel</button>
      <button class="btn" id="di-save-btn" onclick="submitDropIn(false)">Create Character</button>
      <button class="btn launch" id="di-launch-btn" onclick="submitDropIn(true)">Create &amp; Launch D2RLoader</button>
    </div>
  </div>
</div>

<!-- IMPORT EXISTING CHARACTER MODAL -->
<div class="modal-backdrop" id="modal-import">
  <div class="modal">
    <div class="space-between"><h3>Import Existing Character</h3><button class="btn ghost" onclick="closeModal('modal-import')">X</button></div>
    <div style="font-size:12px;color:var(--muted);margin:8px 0;">Copy a character from your Solo profile, Live D2R saves, or another campaign into this campaign's isolated profile.</div>
    <label>Character to Import</label>
    <select id="imp-select" style="width:100%"></select>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;">
      <input type="checkbox" id="imp-respec" style="width:auto;">
      <span>Refund all stats &amp; skills (Respec) on import</span>
    </label>
    <div class="row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn ghost" onclick="closeModal('modal-import')">Cancel</button>
      <button class="btn primary" id="imp-btn" onclick="submitImportChar()">Import Character</button>
    </div>
  </div>
</div>

<!-- EDIT SCHEDULE MODAL -->
<div class="modal-backdrop" id="modal-schedule">
  <div class="modal">
    <div class="space-between"><h3>Update Next Session</h3><button class="btn ghost" onclick="closeModal('modal-schedule')">X</button></div>
    <label>Schedule Label</label>
    <input id="es-sched" style="width:100%" placeholder="Fri 8 PM CT">
    <div class="row">
      <div style="flex:2"><label>Next Session Date &amp; Time</label><input id="es-next" type="datetime-local" style="width:100%"></div>
      <div style="flex:1"><label>Timezone (GMT)</label><select id="es-tz" style="width:100%"></select></div>
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal('modal-schedule')">Cancel</button>
      <button class="btn primary" onclick="submitScheduleUpdate()">Save &amp; Update Discord</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SESSION_TOKEN = document.querySelector('meta[name="castalia-token"]')?.getAttribute("content") || "";
let STATE = { config: {}, env: {}, versions: [], currentTab: "campaigns", activeCampaign: null, activeChars: [] };

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Castalia-Token": SESSION_TOKEN,
      ...(opts.headers || {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._t);
  window._t = setTimeout(() => { el.style.display = "none"; }, 3600);
}

function fmtLocalTime(iso) {
  if (!iso) return "TBD";
  try { return new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" }); }
  catch { return iso; }
}

function buildGcalUrl(c) {
  if (!c || !c.next_session_utc) return null;
  const startDt = new Date(c.next_session_utc);
  if (isNaN(startDt.getTime())) return null;
  const endDt = new Date(startDt.getTime() + 2 * 3600 * 1000);
  const fmt = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    `&text=${encodeURIComponent(`Castalia Co-Op: ${c.title || "Campaign"}`)}` +
    `&dates=${fmt(startDt)}/${fmt(endDt)}` +
    `&details=${encodeURIComponent(`${c.description || ""}\n\nJoin via Castalia Launcher (v${c.castalia_version || "0.4.0"})\nDiscord: https://discord.gg/3mMNCnaze4`)}`;
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

async function refreshState() {
  const s = await api("/local/state");
  STATE.config = s.config;
  STATE.env = s.env;
  STATE.versions = await api("/local/versions");
  const e = STATE.env;
  document.getElementById("status-box").innerHTML =
    `<div>D2RLoader: ${e.d2rloader_found ? '<span class="ok">Ready &#10003;</span>' : '<a href="#" onclick="showTab(\'settings\');return false;" class="warn" style="text-decoration:underline;" title="Click to set your D2R folder in Settings">Missing (Set Folder)</a>'}</div>` +
    `<div>Installed: <b>v${esc(e.installed_mod_version || "none")}</b></div>` +
    `<div>Name: <b>${esc(STATE.config.display_name || "Wanderer")}</b></div>`;
}

function showTab(tab) {
  STATE.currentTab = tab;
  STATE.activeCampaign = null;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("nav-" + tab);
  if (btn) btn.classList.add("active");
  if (tab === "campaigns") renderCampaigns();
  else if (tab === "solo") renderSolo();
  else if (tab === "hoh") renderHoH();
  else if (tab === "settings") renderSettings();
}

async function renderCampaigns() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="space-between" style="margin-bottom:12px;">
    <h2>Active Campaigns</h2>
    <div class="row">
      <label style="margin:0;display:flex;align-items:center;gap:4px;"><input type="checkbox" id="f-open" onchange="loadCampaignList()"> Open Seats Only</label>
      <button class="btn ghost" onclick="loadCampaignList()">Refresh</button>
    </div>
  </div><div id="camp-list">Loading...</div>`;
  await loadCampaignList();
}

async function loadCampaignList() {
  const open = document.getElementById("f-open")?.checked ? "true" : "false";
  const listEl = document.getElementById("camp-list");
  try {
    const camps = await api(`/local/campaigns?open_seats=${open}`);
    if (!camps.length) {
      listEl.innerHTML = `<div class="card">No active campaigns yet. Click <b>+ Create Campaign</b> to host the first one!</div>`;
      return;
    }
    listEl.innerHTML = camps.map(c => `
      <div class="card ${c.status === 'live' ? 'live' : ''}">
        <div class="space-between">
          <div>
            ${c.status === 'live' ? '<span class="pill live">&#128994; LIVE</span>' : `<span class="pill">${esc(String(c.status || "").toUpperCase())}</span>`}
            <b class="serif" style="font-size:16px;color:var(--gold);">${esc(c.title)}</b>
            <span class="pill">v${esc(c.castalia_version)}</span>
            <span class="pill">${(c.campaign_mode || 'pilgrimage') === 'pilgrimage' ? '&#127942; Pilgrimage' : '&#9876; Open Party'}</span>
            <span class="pill">${c.shared_stash ? '&#128230; Global Stash' : '&#128274; Isolated Stash'}</span>
            ${(c.campaign_mode || 'pilgrimage') === 'pilgrimage' && Number(c.total_play_seconds) >= 60 ? `<span class="pill">&#9201; ${esc(fmtDuration(c.total_play_seconds))}</span>` : ''}
          </div>
          <button class="btn primary" data-cid="${esc(c.id)}" onclick="openCampaign(this.dataset.cid)">View / Join</button>
        </div>
        <div style="margin:6px 0;color:var(--muted);">${esc(c.description || "")}</div>
        <div style="font-size:12px;">
          Host: <b>${esc(c.host_name)}</b> &middot;
          Progress: <b>Lvl ${Number(c.current_level) || 1} (${esc(c.current_wp)})</b> &middot;
          Seats: <b>${Number(c.confirmed_seats) || 0}/${Number(c.max_seats) || 5}</b> &middot;
          Schedule: <b>${esc(c.schedule_text)}</b> (Next: ${esc(fmtLocalTime(c.next_session_utc))})
        </div>
      </div>`).join("");
  } catch (e) {
    listEl.innerHTML = `<div class="card" style="border-color:var(--red);">Error: ${esc(e.message)}</div>`;
  }
}

async function openCampaign(cid) {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="card">Loading campaign...</div>`;
  const [c, chars] = await Promise.all([api(`/local/campaigns/${encodeURIComponent(cid)}`), api(`/local/chars/${encodeURIComponent(cid)}`)]);
  STATE.activeCampaign = c;
  STATE.activeChars = chars;

  const liveBanner = c.status === "live" && c.live_join_info ? `
    <div class="card live space-between">
      <div>
        <div class="ok">&#128994; SESSION IS LIVE!</div>
        <div>Join Address: <b style="font-size:14px;color:#fff;">${esc(c.live_join_info)}</b>
          <button class="btn ghost" style="padding:3px 8px;margin-left:6px;" onclick="copyText(STATE.activeCampaign.live_join_info)">Copy</button>
        </div>
      </div>
      <button class="btn launch" onclick="launchTarget(STATE.activeCampaign.id)">&#9654; Play Campaign</button>
    </div>` : `
    <div class="card" style="display:flex;justify-content:flex-end;">
      <button class="btn launch" onclick="launchTarget(STATE.activeCampaign.id)">&#9654; Play Campaign</button>
    </div>`;

  const charRows = chars.length
    ? chars.map((ch, idx) => `
        <div class="space-between" style="padding:5px 0;border-bottom:1px solid #262015;">
          <div><b>${esc(ch.char_name)}</b> &mdash; Lvl ${Number(ch.char_level) || 1} ${esc(ch.class_name)} (${esc(ch.char_wp)}) <span style="color:var(--gold-dim);">[${esc(ch.build_summary)}]</span></div>
          <button class="btn ghost" onclick="rsvpExistingIdx(${idx})">RSVP with Char</button>
        </div>`).join("")
    : `<div style="color:var(--muted);font-size:12px;">No characters in this campaign's isolated save profile yet.</div>`;

  const rosterRows = (c.rsvps || []).map((r, i) => `
    <tr>
      <td>${i + 1}</td><td><b>${esc(r.player_name)}</b></td><td>${esc(r.char_name)}</td>
      <td>Lvl ${Number(r.char_level) || 1} ${esc(String(r.char_class || "").toUpperCase())} (${esc(r.char_wp)})</td>
      <td>${esc(r.build_summary || "—")}</td>
      <td>
        <span class="pill">${esc(r.join_mode)}</span> <span class="pill">${esc(r.status)}</span>
        ${c.is_host ? `<button class="btn danger" style="padding:2px 6px;font-size:11px;margin-left:6px;" data-rid="${esc(r.id)}" onclick="kickRsvp(STATE.activeCampaign.id, this.dataset.rid)">Kick</button>` : ""}
      </td>
    </tr>`).join("") || `<tr><td colspan="6" style="color:var(--muted);">No RSVPs yet.</td></tr>`;

  const isPilgrimage = (c.campaign_mode || "pilgrimage") === "pilgrimage";
  const hostLockedChar = Boolean(c.is_host && isPilgrimage && chars.length > 0);
  const hostClearedHellBaal = isPilgrimage && chars.some(ch => Boolean(ch.hell_baal_cleared));
  const hostBar = c.is_host ? `
    <div class="card">
      <h3 style="margin-bottom:8px;">Host Controls</h3>
      <div class="row">
        <button class="btn" onclick="openScheduleModal()">Edit Schedule</button>
        ${hostClearedHellBaal ? `<button class="btn primary" onclick="promptComplete(STATE.activeCampaign.id)">&#127942; Complete &#8594; Hall of Heroes</button>` : ""}
        <button class="btn danger" onclick="promptDelete(STATE.activeCampaign.id, STATE.activeCampaign.title)">Delete Campaign</button>
      </div>
    </div>` : "";

  main.innerHTML = `
    <div class="space-between" style="margin-bottom:10px;">
      <div class="row">
        <button class="btn ghost" onclick="showTab('campaigns')">&#8592; Back</button>
        <h2>${esc(c.title)}</h2>
        <span class="pill">v${esc(c.castalia_version)}</span>
        <span class="pill">${isPilgrimage ? '&#127942; Pilgrimage' : '&#9876; Open Party'}</span>
        <span class="pill">${c.shared_stash ? '&#128230; Global Stash' : '&#128274; Isolated Stash'}</span>
      </div>
      <div style="font-size:12px;">Progress: <b>Lvl ${Number(c.current_level) || 1} (${esc(c.current_wp)})</b>${isPilgrimage ? ` &middot; Elapsed: <b>&#9201; ${esc(fmtDuration(c.total_play_seconds))}</b>` : ""} &middot; Next: <b>${esc(fmtLocalTime(c.next_session_utc))}</b>${buildGcalUrl(c) ? ` &middot; <a href="${esc(buildGcalUrl(c))}" target="_blank" rel="noopener">&#128197; Add to Google Calendar &#8599;</a>` : ""}</div>

function fmtDuration(sec) {
  const s = Math.max(0, Number(sec) || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

const TZ_LABELS = {
  "-8": "GMT-8 (US Pacific / PST)",
  "-7": "GMT-7 (US Mountain / PDT)",
  "-6": "GMT-6 (US Central / CST)",
  "-5": "GMT-5 (US Eastern / CDT)",
  "-4": "GMT-4 (EDT / Atlantic)",
  "0": "GMT+0 (UTC / London)",
  "1": "GMT+1 (CET / Berlin)",
  "2": "GMT+2 (EET / CEST)",
  "8": "GMT+8 (SGT / CST Asia)",
  "9": "GMT+9 (JST / KST)",
};

function _populateTzSelect(id) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const saved = localStorage.getItem("castalia_tz_offset");
  const detected = String(-Math.round(new Date().getTimezoneOffset() / 60));
  const chosen = saved !== null ? saved : detected;
  let opts = "";
  for (let h = -12; h <= 14; h++) {
    const key = String(h);
    const label = TZ_LABELS[key] || `GMT${h >= 0 ? "+" : ""}${h}`;
    opts += `<option value="${key}"${key === chosen ? " selected" : ""}>${label}</option>`;
  }
  sel.innerHTML = opts;
}

function _localInputToUtcIso(dtLocal, tzOffsetHours) {
  if (!dtLocal) return null;
  const h = Number(tzOffsetHours || 0);
  const sign = h >= 0 ? "+" : "-";
  const absH = String(Math.abs(h)).padStart(2, "0");
  const isoWithTz = `${dtLocal}:00${sign}${absH}:00`;
  const d = new Date(isoWithTz);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

function _utcIsoToTzInput(utcIso, tzOffsetHours) {
  const d = new Date(utcIso);
  if (isNaN(d.getTime())) return _defaultNextSessionLocal();
  const shifted = new Date(d.getTime() + Number(tzOffsetHours || 0) * 3600000);
  return shifted.toISOString().slice(0, 16);
}

function _defaultNextSessionLocal() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(20, 0, 0, 0);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

function openCreateModal() {
  const sel = document.getElementById("c-version");
  // Group releases by MAJOR.MINOR (e.g. "0.4") so Hosts pick a minor line (0.4.x)
  // that automatically tracks the latest patch release in that line.
  const byMinor = new Map();
  for (const v of (STATE.versions || [])) {
    const m = String(v.version || "").match(/^v?(\d+)\.(\d+)\.(\d+)$/);
    if (!m) continue;
    const minorKey = `${m[1]}.${m[2]}`;
    const patchNum = Number(m[3]);
    const prev = byMinor.get(minorKey);
    if (!prev || patchNum > prev.patchNum) {
      byMinor.set(minorKey, { minorKey, patchNum, version: `${m[1]}.${m[2]}.${m[3]}` });
    }
  }
  const minorOpts = Array.from(byMinor.values())
    .map(g => `<option value="${esc(g.version)}">v${esc(g.minorKey)}.x (latest: v${esc(g.version)})</option>`)
    .join("");
  sel.innerHTML = minorOpts || `<option value="0.4.3">v0.4.x (latest: v0.4.3)</option>`;
  _populateTzSelect("c-tz");
  const nextEl = document.getElementById("c-next");
  if (nextEl && !nextEl.value) nextEl.value = _defaultNextSessionLocal();
  onCreateModeChange();
  openModal("modal-create");
}

function onCreateModeChange() {
  const isPilg = document.getElementById("c-mode").value === "pilgrimage";
  const lvEl = document.getElementById("c-level");
  const wpEl = document.getElementById("c-wp");
  lvEl.disabled = isPilg;
  wpEl.disabled = isPilg;
  if (isPilg) { lvEl.value = "1"; wpEl.value = "a1n"; }
}

async function submitCreateCampaign() {
  const nextVal = document.getElementById("c-next").value;
  const tzVal = document.getElementById("c-tz").value;
  localStorage.setItem("castalia_tz_offset", tzVal);
  const res = await api("/local/campaigns", {
    method: "POST",
    body: {
      title: document.getElementById("c-title").value,
      description: document.getElementById("c-desc").value,
      ruleset: "standard",
      campaign_mode: document.getElementById("c-mode").value,
      castalia_version: document.getElementById("c-version").value,
      current_level: Number(document.getElementById("c-level").value || 1),
      current_wp: document.getElementById("c-wp").value,
      max_seats: Number(document.getElementById("c-seats").value || 5),
      shared_stash: Boolean(document.getElementById("c-shared-stash").checked),
      schedule_text: document.getElementById("c-sched").value,
      next_session_utc: _localInputToUtcIso(nextVal, tzVal),
    },
  });
  closeModal("modal-create");
  toast("Campaign created!");
  openCampaign(res.campaign.id);
}

let DROPIN_CTX = { solo: false };

function openDropInModal(autoPrompt = false, soloMode = false) {
  DROPIN_CTX = { solo: soloMode };
  if (soloMode) {
    document.getElementById("di-title").textContent = "Create Fresh Level 1 Solo Character";
    document.getElementById("di-banner").innerHTML =
      `Creates a fresh <b>Level 1</b> character in <code>profiles/solo/</code> (Normal Act 1, 4x Minor Healing Potions + <b>2,000 Gold</b>) so you can buy starter gear and launch straight into play.`;
    document.getElementById("di-save-btn").textContent = "Create Character";
    document.getElementById("di-launch-btn").textContent = "Play Solo";
  } else {
    const c = STATE.activeCampaign;
    const isFresh = Number(c.current_level) <= 1;
    document.getElementById("di-title").textContent = isFresh
      ? "Create Fresh Level 1 Campaign Character"
      : "Generate Drop-In Starter-Kit Character";
    const note = autoPrompt ? `<div class="warn" style="margin-bottom:4px;">No character in this campaign profile yet — create one first so you can jump straight into Multiplayer!</div>` : "";
    const kit = isFresh
      ? "Fresh Level 1 start (4x Minor Healing Potions + <b>2,000 Gold</b> to buy starter gear) — ready immediately on Character Select."
      : `Locked to Campaign Snapshot: <b>Level ${c.current_level} &middot; ${c.current_wp}</b> (tier-matched Starter Kit).`;
    document.getElementById("di-banner").innerHTML = `${note}${kit} &middot; Castalia <b>v${c.castalia_version}</b>`;
    document.getElementById("di-save-btn").textContent = "Create .d2s & RSVP";
    document.getElementById("di-launch-btn").textContent = c.is_host ? "Start Campaign" : "Join Campaign";
  }
  document.getElementById("di-name").value = "";
  openModal("modal-dropin");
}

async function submitDropIn(andLaunch = false) {
  const name = document.getElementById("di-name").value.trim();
  const cls = document.getElementById("di-class").value;
  if (!name) return toast("Enter a character name.");

  if (DROPIN_CTX.solo) {
    const telem = await api("/local/dropin", {
      method: "POST",
      body: { target: "solo", char_name: name, char_class: cls, level: 1, wp_code: "a1n" },
    });
    closeModal("modal-dropin");
    toast(`Created Level 1 ${telem.char_name}.d2s!`);
    if (andLaunch) await doLaunch("solo");
    renderSolo();
    return;
  }

  const c = STATE.activeCampaign;
  const cleanName = name.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 15);
  if (!cleanName) return toast("Use letters, numbers, _ or - for your character name.");
  const taken = (c.rsvps || []).some(
    r => r.status !== "cancelled" && String(r.char_name || "").toLowerCase() === cleanName.toLowerCase()
  );
  if (taken) {
    return toast(`'${cleanName}' is already taken in this campaign — pick a unique name so D2RLoader lets you join.`);
  }
  const telem = await api("/local/dropin", {
    method: "POST",
    body: {
      target: c.id,
      char_name: cleanName,
      char_class: cls,
      level: c.current_level,
      wp_code: c.current_wp,
      has_cube: Boolean(c.has_cube),
      host_progress_b64: c.host_progress_b64 || null,
    },
  });
  await api("/local/rsvp", {
    method: "POST",
    body: {
      campaign_id: c.id,
      char_name: telem.char_name,
      char_class: telem.char_class,
      join_mode: Number(c.current_level) <= 1 ? "returning" : "drop_in",
      char_level: telem.char_level,
      char_wp: telem.char_wp,
      build_summary: telem.build_summary,
    },
  });
  closeModal("modal-dropin");
  toast(`Created ${telem.char_name}.d2s & RSVPed!`);
  if (andLaunch) await doLaunch(c.id);
  openCampaign(c.id);
}

async function rsvpExistingIdx(idx) {
  const ch = (STATE.activeChars || [])[idx];
  const c = STATE.activeCampaign;
  if (!ch || !c) return;
  try {
    await api("/local/rsvp", {
      method: "POST",
      body: {
        campaign_id: c.id,
        char_name: ch.char_name,
        char_class: ch.char_class,
        join_mode: "returning",
        char_level: ch.char_level,
        char_wp: ch.char_wp,
        build_summary: ch.build_summary || "",
      },
    });
    toast(`RSVPed with ${ch.char_name}!`);
    openCampaign(c.id);
  } catch (e) {
    toast(e.message);
  }
}
async function kickRsvp(cid, rid) {
  if (!confirm("Remove this player from the campaign roster?")) return;
  await api("/local/rsvp/cancel", { method: "POST", body: { campaign_id: cid, rsvp_id: rid } });
  toast("Player removed from roster.");
  openCampaign(cid);
}

async function copyText(t) { await api("/local/clipboard", { method: "POST", body: { text: t } }); toast("Copied to clipboard!"); }
async function doLaunch(t) { await api("/local/launch", { method: "POST", body: { target: t } }); toast("Synced profile & launched D2RLoader!"); }
async function launchTarget(t) {
  const chars = await api(`/local/chars/${t}`);
  if (!chars.length) {
    openDropInModal(true, t === "solo");
    return;
  }
  await doLaunch(t);
}
async function promptGoLive(cid) { const g = prompt("Enter D2RLoader Game ID (or leave blank to auto-detect on launch):"); if (g !== null) { await api("/local/live", { method: "POST", body: { campaign_id: cid, game_id: g } }); toast("Campaign is LIVE!"); openCampaign(cid); } }

async function promptComplete(cid) { const s = prompt("Hall of Heroes summary:"); const d = prompt("Total party deaths:", "0"); if (s) { await api("/local/complete", { method: "POST", body: { campaign_id: cid, summary: s, death_count: Number(d || 0) } }); toast("Archived to Hall of Heroes!"); showTab("hoh"); } }
function openScheduleModal() {
  const c = STATE.activeCampaign;
  if (!c) return;
  document.getElementById("es-sched").value = c.schedule_text || "";
  _populateTzSelect("es-tz");
  const tzVal = document.getElementById("es-tz").value;
  if (c.next_session_utc) {
    document.getElementById("es-next").value = _utcIsoToTzInput(c.next_session_utc, tzVal);
  } else {
    document.getElementById("es-next").value = _defaultNextSessionLocal();
  }
  openModal("modal-schedule");
}

async function submitScheduleUpdate() {
  const c = STATE.activeCampaign;
  if (!c) return;
  const sched = document.getElementById("es-sched").value.trim();
  const nextEl = document.getElementById("es-next");
  if (nextEl.validity && nextEl.validity.badInput) {
    return toast("Please complete both date and time (including AM/PM).");
  }
  const nextVal = nextEl.value;
  const tzVal = document.getElementById("es-tz").value;
  localStorage.setItem("castalia_tz_offset", tzVal);
  const body = { campaign_id: c.id };
  if (sched) body.schedule_text = sched;
  const utcIso = _localInputToUtcIso(nextVal, tzVal);
  if (utcIso) body.next_session_utc = utcIso;
  await api("/local/schedule", { method: "POST", body });
  closeModal("modal-schedule");
  toast("Updated session schedule & Discord post!");
  openCampaign(c.id);
}

async function saveSettings() {
  await api("/local/config", { method: "POST", body: { display_name: document.getElementById("s-name").value, api_url: document.getElementById("s-api").value, host_connect_address: document.getElementById("s-hostaddr").value, d2r_game_dir: document.getElementById("s-gdir").value, d2r_save_dir: document.getElementById("s-sdir").value } });
  await refreshState(); toast("Settings saved!"); renderSettings();
}

  const el = document.getElementById(inputId);
  const res = await api("/local/browse-dir", { method: "POST", body: { title, initial_dir: el.value } });
  if (res && res.path) { el.value = res.path; toast("Folder selected — click Save Settings."); }
}
async function testHostAddr() {
  const st = document.getElementById("s-host-status");
  const addr = document.getElementById("s-hostaddr").value.trim();
  st.textContent = "Testing TCP reachability...";
  const res = await api("/local/test-host", { method: "POST", body: { address: addr } });
  st.innerHTML = res.reachable
    ? `<span class="ok">&#10003; ${esc(res.message)}</span>`
    : `<span class="warn">&#9888; ${esc(res.message)}</span>`;
}
async function openImportModal() {
  const c = STATE.activeCampaign;
  const cands = await api(`/local/importable-chars?campaign_id=${encodeURIComponent(c.id)}`);
  STATE.importableChars = cands;
  const sel = document.getElementById("imp-select");
  if (!cands.length) {
    sel.innerHTML = `<option value="">(No existing characters found in Solo or Live Saves)</option>`;
    document.getElementById("imp-btn").disabled = true;
  } else {
    sel.innerHTML = cands.map((ch, i) => `<option value="${i}">${esc(ch.char_name)} — Lvl ${Number(ch.char_level) || 1} ${esc(ch.class_name)} (${esc(ch.char_wp)}) [${esc(ch.source_label)}]</option>`).join("");
    document.getElementById("imp-btn").disabled = false;
  }
  document.getElementById("imp-respec").checked = false;
  openModal("modal-import");
}
async function submitImportChar() {
  const c = STATE.activeCampaign;
  const idx = Number(document.getElementById("imp-select").value);
  const chosen = (STATE.importableChars || [])[idx];
  if (!chosen) return;
  const respec = document.getElementById("imp-respec").checked;
  await api("/local/import-char", { method: "POST", body: { campaign_id: c.id, source_path: chosen.source_path, respec } });
  closeModal("modal-import");
  toast(`Imported ${chosen.char_name}${respec ? " (respecced)" : ""}!`);
  openCampaign(c.id);
}
async function respecSoloChar(idx) {
  const ch = (STATE.soloChars || [])[idx];
  if (!ch) return;
  if (!confirm(`Refund all skill & stat points on Solo character "${ch.char_name}"?`)) return;
  await api("/local/respec-char", { method: "POST", body: { target: "solo", char_name: ch.char_name, reset_stats: true } });
  toast(`Respecced ${ch.char_name}!`);
  renderSolo();
}
async function exportTokens() { const r = await api("/local/tokens/export"); await copyText(r.tokens_json); }
async function importTokens() { const raw = prompt("Paste exported tokens.json:"); if (raw) { const r = await api("/local/tokens/import", { method: "POST", body: { tokens_json: raw } }); toast(`Imported ${r.imported} campaign tokens!`); } }

(async () => { await refreshState(); showTab("campaigns"); })();
